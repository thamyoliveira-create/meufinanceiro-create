<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Financeiro IA - Gestão Financeira Pessoal Inteligente</title>
  <meta name="description" content="Aplicativo moderno de gestão financeira pessoal com Inteligência Artificial, gráficos interativos, metas e orçamentos.">
  <meta name="theme-color" content="#0B0F17">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            fintech: {
              bg: '#0B0F17',
              card: '#1A2234',
              primary: '#10B981',
              secondary: '#6366F1',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
  <!-- Container Principal da Aplicação SPA -->
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div>
        <p class="text-xs font-semibold text-slate-400">Carregando Meu Financeiro IA...</p>
      </div>
    </div>
  </div>

  <!-- Módulo Principal ES -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
