<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meu Financeiro IA - Gestão Financeira Pessoal Inteligente</title>
  <meta name="description" content="Aplicativo moderno de gestão financeira pessoal com Inteligência Artificial, gráficos interativos, metas e orçamentos.">
  <meta name="theme-color" content="#08090C">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            fintech: {
              bg: '#08090C',
              card: '#0E1015',
              primary: '#FFFFFF',
              accent: '#10B981',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Mozilla PDF.js CDN para Leitura de Extratos em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Estilos Personalizados Minimalistas -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="bg-[#08090C] text-zinc-100 antialiased selection:bg-white selection:text-black">
  <!-- Container Principal SPA -->
  <div id="app">
    <div class="min-h-screen flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <div class="w-8 h-8 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-zinc-400">Carregando Meu Financeiro IA...</p>
      </div>
    </div>
  </div>

  <!-- Módulo Principal ES -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
