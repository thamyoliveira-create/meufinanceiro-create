<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gastosa 98 - Controle Financeiro Pessoal Inteligente</title>
  <meta name="description" content="Gastosa 98 - O aplicativo inteligente de gestão financeira pessoal para você estar sempre no comando do seu dinheiro.">
  <meta name="theme-color" content="#008080">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            fintech: {
              bg: '#008080',
              card: '#c0c0c0',
              primary: '#000080',
              accent: '#006600',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Mozilla PDF.js CDN para Leitura de Extratos em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Estilos Personalizados Windows 98 -->
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="bg-[#008080] text-black antialiased">
  <!-- Container Principal SPA -->
  <div id="app">
    <div class="min-h-screen flex items-center justify-center bg-[#008080]">
      <div class="win-window p-4 shadow-2xl text-center space-y-2">
        <div class="win-titlebar">
          <span>Iniciando Gastosa 98...</span>
        </div>
        <div class="p-4 flex flex-col items-center gap-2">
          <span class="text-3xl">🪟</span>
          <p class="text-xs font-bold text-black">Carregando o Gastosa 98...</p>
          <div class="w-48 h-3 win-inset bg-white p-0.5 overflow-hidden">
            <div class="h-full bg-[#000080] animate-pulse w-full"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Módulo Principal ES -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
